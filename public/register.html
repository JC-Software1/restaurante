<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema Restaurante</title>
    <meta name="theme-color" content="#183A37">
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js" defer></script>
    <script src="/icons.js" defer></script>
    <script src="/performance-mode.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #183A37;
            --primary-dark: #2B2118;
            --secondary: #A8A39A;
            --success: #2E7D5B;
            --danger: #C0392B;
            --accent: #C9A227;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 12% 18%, var(--accent-soft) 0%, transparent 38%),
                radial-gradient(circle at 88% 82%, var(--primary-soft) 0%, transparent 40%),
                radial-gradient(circle at 78% 12%, var(--accent-soft) 0%, transparent 26%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(201, 162, 39, 0.10) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        .auth-shell {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 2;
            max-height: 94vh;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .auth-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            animation: fadeDown 0.6s ease-out both;
        }

        .auth-brand .logo-mark {
            width: 68px;
            height: 68px;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--jc-green) 0%, var(--jc-coffee) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 32px rgba(24, 58, 55, 0.35);
            margin-bottom: 14px;
        }

        .auth-brand .logo-mark svg {
            width: 34px;
            height: 34px;
            color: var(--jc-gold);
        }

        .auth-brand h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .auth-brand p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            padding: 34px 32px 30px;
            animation: fadeUp 0.7s 0.1s ease-out both;
        }

        .card-heading {
            text-align: center;
            margin-bottom: 24px;
        }

        .card-heading h2 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--text);
        }

        .card-heading p {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            color: var(--text);
            font-weight: 600;
            font-size: 13px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            color: var(--text-soft);
            transition: color 0.3s;
            pointer-events: none;
        }

        .input-icon svg {
            width: 19px;
            height: 19px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 13px 52px 13px 46px;
            border: 1.5px solid var(--border);
            border-radius: 15px;
            font-size: 14.5px;
            font-family: inherit;
            background: var(--card-2);
            color: var(--text);
            transition: all 0.25s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-select {
            cursor: pointer;
        }

        .form-input::placeholder {
            color: var(--text-soft);
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--card);
            box-shadow: 0 0 0 5px var(--accent-soft);
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--accent);
        }

        .password-toggle {
            position: absolute;
            right: 11px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-soft);
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .password-toggle:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
        }

        .helper-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .btn-register {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--jc-green) 0%, var(--jc-coffee) 100%);
            color: #F5EFE1;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(24, 58, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-register svg {
            width: 18px;
            height: 18px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(24, 58, 55, 0.4);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .btn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 12.5px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 14px;
        }

        .login-link {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .login-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        .login-link a:hover {
            color: var(--accent-2);
        }

        .alert {
            padding: 13px 15px;
            border-radius: 13px;
            margin-bottom: 18px;
            font-size: 13.5px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .alert.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            width: 19px;
            height: 19px;
            border: 3px solid rgba(245, 239, 225, 0.3);
            border-top-color: #F5EFE1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-spinner.show {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
                align-items: flex-start;
                padding-top: 28px;
            }

            .auth-brand .logo-mark {
                width: 58px;
                height: 58px;
                border-radius: 18px;
            }

            .auth-brand h1 {
                font-size: 21px;
            }

            .auth-card {
                padding: 26px 20px 24px;
                border-radius: 24px;
            }

            .form-input,
            .form-select {
                padding: 12px 48px 12px 44px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-shell">
        <div class="auth-brand">
            <div class="logo-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v6a2 2 0 0 0 4 0V2"/><path d="M8 2v20"/><path d="M16 2a4 4 0 0 0-4 4v2h4a2 2 0 0 0 2-2z"/><path d="M16 8v14"/></svg>
            </div>
            <h1>Crear Cuenta</h1>
            <p>Únete al Sistema de Restaurante</p>
        </div>

        <div class="auth-card">
            <div class="card-heading">
                <h2>Registro</h2>
                <p>Completa tus datos para comenzar</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="nombreRestaurante">Nombre del Restaurante *</label>
                    <div class="input-wrapper">
                        <input type="text" id="nombreRestaurante" class="form-input"
                            placeholder="Ej: Restaurante El Sabor" required minlength="3">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 21V8l6-5 6 5v13"/><path d="M10 21v-6h4v6"/></svg>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="nitRestaurante">NIT del Restaurante (Opcional)</label>
                    <div class="input-wrapper">
                        <input type="text" id="nitRestaurante" class="form-input" placeholder="Ej: 123456789-0">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/></svg>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="sede">Sede (Opcional)</label>
                    <div class="input-wrapper">
                        <input type="text" id="sede" class="form-input" placeholder="Ej: Centro, Norte, Sur, etc.">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        </span>
                    </div>
                    <div class="helper-text">Si tienes varias sedes, especifica cuál es</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="nombre">Nombre Completo *</label>
                    <div class="input-wrapper">
                        <input type="text" id="nombre" class="form-input" placeholder="Johan Mejía" required
                            autocomplete="name" minlength="2">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Usuario *</label>
                    <div class="input-wrapper">
                        <input type="text" id="email" class="form-input" placeholder="johan" required
                            autocomplete="username" minlength="3">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                        </span>
                    </div>
                    <div class="helper-text">Puedes usar un nombre de usuario simple</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña *</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required
                            autocomplete="new-password" minlength="6">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <button type="button" class="password-toggle" onclick="togglePassword('password', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                    <div class="helper-text">Mínimo 6 caracteres</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirmar Contraseña *</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required
                            autocomplete="new-password">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="rol">Rol *</label>
                    <div class="input-wrapper">
                        <select id="rol" class="form-select" required>
                            <option value="mesero">Mesero</option>
                            <option value="cajero">Cajero</option>
                            <option value="admin">Administrador</option>
                        </select>
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 11l2 2 4-4"/></svg>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn-register" id="registerBtn">
                    <span class="btn-text" id="btnText">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        Crear Cuenta
                    </span>
                    <div class="loading-spinner" id="loadingSpinner"></div>
                </button>
            </form>

            <div class="divider">
                <span>¿Ya tienes cuenta?</span>
            </div>

            <div class="login-link">
                <a href="index.html">Iniciar sesión</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://restaurante-1-1bo2.onrender.com/api/auth';

        function togglePassword(inputId, btn) {
            const passwordInput = document.getElementById(inputId);
            const svg = btn.querySelector('svg');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                passwordInput.type = 'password';
                svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        function showAlert(message, type = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;

            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('registerBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');

            if (isLoading) {
                btn.disabled = true;
                btnText.style.display = 'none';
                spinner.classList.add('show');
            } else {
                btn.disabled = false;
                btnText.style.display = 'flex';
                spinner.classList.remove('show');
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombreRestaurante = document.getElementById('nombreRestaurante').value.trim();
            const sede = document.getElementById('sede').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const rol = document.getElementById('rol').value;

            // Validaciones
            if (!nombreRestaurante || !nombre || !email || !password || !confirmPassword) {
                showAlert('Por favor complete todos los campos obligatorios', 'error');
                return;
            }

            if (nombreRestaurante.length < 3) {
                showAlert('El nombre del restaurante debe tener al menos 3 caracteres', 'error');
                return;
            }

            if (nombre.length < 2) {
                showAlert('El nombre debe tener al menos 2 caracteres', 'error');
                return;
            }

            if (email.length < 3) {
                showAlert('El usuario debe tener al menos 3 caracteres', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Las contraseñas no coinciden', 'error');
                return;
            }

            setLoading(true);

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nombreRestaurante,
                        nitRestaurante: document.getElementById('nitRestaurante').value.trim(),
                        sede,
                        nombre,
                        email,
                        password,
                        rol
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('¡Cuenta creada exitosamente! Redirigiendo...', 'success');

                    // Guardar token y datos del usuario
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));

                    setTimeout(() => {
                        if (data.usuario.rol === 'mesero') {
                            window.location.href = 'pedidos.html';
                        } else {
                            window.location.href = 'productos.html';
                        }
                    }, 1500);
                } else {
                    showAlert(data.message || 'Error al crear la cuenta', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error de conexión. Por favor intente nuevamente', 'error');
            } finally {
                setLoading(false);
            }
        });

    </script>
    <script src="scripts/tech-support-alert.js"></script>
</body>

</html>
