<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú del Cliente</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#183A37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js" defer></script>
    <script src="/icons.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(160deg, #183A37 0%, #2B2118 100%);
            min-height: 100vh;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 15% 20%, rgba(201, 162, 39, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(201, 162, 39, 0.10) 0%, transparent 40%);
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            color: #F5EFE1;
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.85;
            color: #F5EFE1;
        }

        .mesa-info {
            background: rgba(245, 239, 225, 0.97);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.6s ease;
            border: 1px solid rgba(201, 162, 39, 0.4);
        }

        .mesa-info h2 {
            font-size: 24px;
            font-weight: 700;
            color: #183A37;
            margin-bottom: 4px;
        }

        .mesa-info p {
            font-size: 14px;
            color: #6B614F;
        }

        .options-grid {
            display: grid;
            gap: 1.5rem;
            animation: slideUp 0.6s ease 0.2s both;
        }

        .option-card {
            background: rgba(245, 239, 225, 0.98);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            border: 2px solid transparent;
        }

        .option-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            border-color: #C9A227;
        }

        .option-card:active {
            transform: translateY(-4px);
        }

        .option-icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 1rem;
            border-radius: 22px;
            background: linear-gradient(135deg, #183A37 0%, #2B2118 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #C9A227;
            box-shadow: 0 8px 24px rgba(24, 58, 55, 0.3);
            animation: bounce 2s infinite;
        }

        .option-icon svg {
            width: 40px;
            height: 40px;
        }

        .option-card:nth-child(2) .option-icon {
            animation-delay: 0.2s;
        }

        .option-title {
            font-size: 22px;
            font-weight: 700;
            color: #2B2118;
            margin-bottom: 0.5rem;
        }

        .option-description {
            font-size: 14px;
            color: #6B614F;
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            color: #F5EFE1;
            padding: 3rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(245, 239, 225, 0.25);
            border-top-color: #C9A227;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 26px;
            }

            .option-icon {
                width: 68px;
                height: 68px;
                border-radius: 18px;
            }

            .option-title {
                font-size: 18px;
            }

            .option-description {
                font-size: 13px;
            }
        }
    </style>
    <script src="/performance-mode.js" defer></script>
</head>

<body>
    <div class="container" id="content">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Cargando información...</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://restaurante-1-1bo2.onrender.com/api';

        const urlParams = new URLSearchParams(window.location.search);
        const restaurante = urlParams.get('restaurante');
        const mesa = urlParams.get('mesa');
        const sede = urlParams.get('sede');

        window.addEventListener('DOMContentLoaded', async () => {
            if (!restaurante) {
                showError();
                return;
            }

            // Si no hay mesa, verificar si es tipo general
            if (!mesa && urlParams.get('tipo') !== 'general') {
                showError();
                return;
            }

            await verificarRestaurante();
        });

        async function verificarRestaurante() {
            try {
                // Construir los parámetros correctamente
                const params = new URLSearchParams();
                params.append('restaurante', restaurante);

                if (sede) {
                    params.append('sede', sede);
                }

                console.log('🔍 Verificando:', restaurante, sede || '(sin sede)');
                console.log('📍 URL:', `${API_URL}/products/public/restaurante?${params.toString()}`);

                // Usar el endpoint público de productos para verificar que el restaurante existe
                const response = await fetch(`${API_URL}/products/public/restaurante?${params.toString()}`);

                console.log('📊 Response status:', response.status);

                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Data:', data);

                    if (data.success) {
                        // El restaurante existe - configurar PWA
                        await setupPWA();
                        showOptions();
                    } else {
                        console.log('❌ Sin éxito:', data.message);
                        showError();
                    }
                } else {
                    console.log('❌ Response no OK:', response.status);
                    const errorData = await response.json().catch(() => ({}));
                    console.log('Error data:', errorData);
                    showError();
                }
            } catch (error) {
                console.error('❌ Error completo:', error);
                showError();
            }
        }

        function showOptions() {
            const content = document.getElementById('content');
            const sedeText = sede ? `<p>Sede: ${sede}</p>` : '';

            content.innerHTML = `
                <div class="header">
                    <h1>Bienvenido</h1>
                    <p>${restaurante}</p>
                </div>

                ${mesa ? `
                <div class="mesa-info">
                    <h2>Mesa ${mesa}</h2>
                    ${sedeText}
                </div>
                ` : `
                <div class="mesa-info">
                    <h2>Ordena Ahora</h2>
                    ${sedeText}
                </div>
                `}

                <div class="options-grid">
                    <div class="option-card" onclick="irASeguimiento()">
                        <div class="option-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/><path d="M8 11h6M11 8v6"/></svg>
                        </div>
                        <h3 class="option-title">Ver Mi Pedido</h3>
                        <p class="option-description">
                            Consulta el estado actual de tu pedido en tiempo real
                        </p>
                    </div>

                    <div class="option-card" onclick="irAMenu()">
                        <div class="option-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 9h8M8 13h5M8 17h8"/><path d="M3 8V7a2 2 0 0 1 2-2h1"/></svg>
                        </div>
                        <h3 class="option-title">Hacer un Pedido</h3>
                        <p class="option-description">
                            Explora nuestro menú y ordena directamente desde tu mesa
                        </p>
                    </div>
                </div>
            `;
        }

        async function setupPWA() {
            try {
                const manifestLink = document.querySelector('link[rel="manifest"]');
                const response = await fetch('/manifest.json');
                const manifest = await response.json();

                // Actualizar nombre del restaurante para iOS PWA
                if (mesa) {
                    manifest.name = `${restaurante} - Mesa ${mesa}`;
                    manifest.short_name = `${restaurante} - ${mesa}`;
                } else {
                    manifest.name = restaurante;
                    manifest.short_name = restaurante;
                }
                
                // Asegurar que la start_url sea la actual completa
                manifest.start_url = window.location.href;

                const stringManifest = JSON.stringify(manifest);
                const blob = new Blob([stringManifest], { type: 'application/json' });
                const manifestURL = URL.createObjectURL(blob);

                manifestLink.setAttribute('href', manifestURL);
                console.log('✅ Manifest dinámico generado:', {
                    name: manifest.name,
                    short_name: manifest.short_name,
                    start_url: manifest.start_url
                });
            } catch (e) {
                console.error('Error configurando PWA:', e);
            }
        }

        function irASeguimiento() {
            let mesaActual = mesa;

            if (!mesaActual) {
                mesaActual = prompt("Por favor, ingresa tu nombre o número de mesa para buscar tu pedido:");
                if (!mesaActual) return;
            }

            const params = new URLSearchParams({
                restaurante: restaurante,
                mesa: mesaActual.trim()
            });

            if (sede) {
                params.append('sede', sede);
            }

            window.location.href = `seguimiento.html?${params.toString()}`;
        }

        function irAMenu() {
            const params = new URLSearchParams({
                restaurante: restaurante
            });

            if (mesa) {
                params.append('mesa', mesa);
            }

            if (sede) {
                params.append('sede', sede);
            }

            window.location.href = `hacer-pedido.html?${params.toString()}`;
        }

        function showError() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="header">
                    <h1>
                        <svg class="jc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                        Información Incompleta
                    </h1>
                    <p>El código QR no contiene la información necesaria</p>
                </div>
            `;
        }
    </script>
    <script src="scripts/tech-support-alert.js"></script>
</body>

</html>
