<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mandao - Sistema de Gestión</title>

    <!-- Mandao PWA -->
    <meta name="theme-color" content="#183A37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <script src="/performance-mode.js" defer></script>
    <script src="/pwa-init.js" defer></script>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js" defer></script>
    <script src="/icons.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #183A37;
            --primary-dark: #2B2118;
            --secondary: #A8A39A;
            --success: #2E7D5B;
            --danger: #C0392B;
            --accent: #C9A227;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        /* Fondo decorativo con puntos elegantes */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 12% 18%, var(--accent-soft) 0%, transparent 38%),
                radial-gradient(circle at 88% 82%, var(--primary-soft) 0%, transparent 40%),
                radial-gradient(circle at 78% 12%, var(--accent-soft) 0%, transparent 26%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(201, 162, 39, 0.10) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        .auth-shell {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 2;
        }

        /* Marca superior */
        .auth-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
            animation: fadeDown 0.6s ease-out both;
        }

        .auth-brand .logo-mark {
            width: 76px;
            height: 76px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--jc-green) 0%, var(--jc-coffee) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 32px rgba(24, 58, 55, 0.35);
            margin-bottom: 16px;
        }

        .auth-brand .logo-mark svg {
            width: 38px;
            height: 38px;
            color: var(--jc-gold);
        }

        .auth-brand h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .auth-brand p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            padding: 36px 32px 32px;
            animation: fadeUp 0.7s 0.1s ease-out both;
        }

        .auth-card .card-heading {
            text-align: center;
            margin-bottom: 26px;
        }

        .auth-card .card-heading h2 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--text);
        }

        .auth-card .card-heading p {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 600;
            font-size: 13.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            color: var(--text-soft);
            transition: color 0.3s;
            pointer-events: none;
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
        }

        .form-input {
            width: 100%;
            padding: 15px 52px 15px 48px;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            font-size: 15px;
            font-family: inherit;
            background: var(--card-2);
            color: var(--text);
            transition: all 0.25s ease;
            -webkit-appearance: none;
        }

        .form-input::placeholder {
            color: var(--text-soft);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--card);
            box-shadow: 0 0 0 5px var(--accent-soft);
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--accent);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-soft);
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .password-toggle:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }

        .password-toggle svg {
            width: 19px;
            height: 19px;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 22px;
        }

        .forgot-password a {
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .forgot-password a:hover {
            color: var(--accent-2);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--jc-green) 0%, var(--jc-coffee) 100%);
            color: #F5EFE1;
            border: none;
            border-radius: 16px;
            font-size: 15.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(24, 58, 55, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login svg {
            width: 18px;
            height: 18px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(24, 58, 55, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .btn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-mandao {
            width: 100%;
            margin-top: 14px;
            padding: 15px;
            background: var(--accent-soft);
            color: var(--accent-2);
            border: 1.5px solid rgba(201, 162, 39, 0.45);
            border-radius: 16px;
            font-size: 14.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-mandao svg {
            width: 18px;
            height: 18px;
        }

        .btn-mandao:hover {
            background: var(--accent);
            color: #2B2118;
            box-shadow: 0 6px 18px rgba(201, 162, 39, 0.35);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 26px 0;
            color: var(--text-muted);
            font-size: 12.5px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 14px;
        }

        .register-link {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .register-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        .register-link a:hover {
            color: var(--accent-2);
        }

        .alert {
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 13.5px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .alert.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(245, 239, 225, 0.3);
            border-top-color: #F5EFE1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-spinner.show {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pantallas móviles */
        @media (max-width: 480px) {
            body {
                padding: 16px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .auth-brand .logo-mark {
                width: 64px;
                height: 64px;
                border-radius: 20px;
            }

            .auth-brand h1 {
                font-size: 22px;
            }

            .auth-card {
                padding: 28px 22px 26px;
                border-radius: 24px;
            }

            .form-input {
                padding: 14px 48px 14px 46px;
            }
        }

        /* Computadoras grandes: centrado con más aire */
        @media (min-width: 1024px) {
            .auth-shell {
                max-width: 480px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="auth-shell">
        <div class="auth-brand">
            <div class="logo-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M6 2v6a2 2 0 0 0 4 0V2" />
                    <path d="M8 2v20" />
                    <path d="M16 2a4 4 0 0 0-4 4v2h4a2 2 0 0 0 2-2z" />
                    <path d="M16 8v14" />
                </svg>
            </div>
            <h1>Bienvenido</h1>
            <p>Sistema de Gestión de Restaurante</p>
        </div>

        <div class="auth-card">
            <div class="card-heading">
                <h2>Iniciar sesión</h2>
                <p>Accede a tu panel de gestión</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="email" class="form-input" placeholder="johan" required
                            autocomplete="username">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="8" r="4" />
                                <path d="M4 20a8 8 0 0 1 16 0" />
                            </svg>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required
                            autocomplete="current-password">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2.5" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <button type="button" class="password-toggle" id="passwordToggle"
                            aria-label="Mostrar contraseña">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text" id="btnText">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <path d="M16 17l5-5-5-5" />
                            <path d="M21 12H9" />
                        </svg>
                        Iniciar Sesión
                    </span>
                    <div class="loading-spinner" id="loadingSpinner"></div>
                </button>

                <button type="button" class="btn-mandao" id="loginMandaoBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
                        <path
                            d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" />
                        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
                        <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
                    </svg>
                    Iniciar sesión con Mandao
                </button>
            </form>

            <div class="divider">
                <span>¿No tienes cuenta?</span>
            </div>

            <div class="register-link">
                <a href="register.html">Registrarse aquí</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://restaurante-1-1bo2.onrender.com/api/auth';
        // const API_URL = 'http://localhost:3000/api/auth'; // Para pruebas locales

        async function verificarSesionAutomatica() {
            const token = localStorage.getItem('token');
            const usuarioGuardado = localStorage.getItem('usuario');

            if (token && usuarioGuardado) {
                try {
                    const response = await fetch(`${API_URL}/verify`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();

                        if (data.success && data.usuario) {
                            localStorage.setItem('usuario', JSON.stringify(data.usuario));

                            if (data.usuario.rol === 'superadmin') {
                                window.location.href = 'superadmin.html';
                            } else if (data.usuario.rol === 'admin') {
                                window.location.href = 'administrador.html';
                            } else if (data.usuario.rol === 'mesero') {
                                window.location.href = 'pedidos.html';
                            } else {
                                window.location.href = 'productos.html';
                            }
                            return true;
                        }
                    }
                    localStorage.removeItem('token');
                    localStorage.removeItem('usuario');
                } catch (error) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('usuario');
                }
            }
            return false;
        }

        verificarSesionAutomatica();

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        document.getElementById('passwordToggle').addEventListener('click', togglePassword);


        function showAlert(message, type = 'error', showWhatsApp = false) {
            const iconType = type === 'success' ? 'success' : (type === 'error' ? 'error' : 'info');

            if (showWhatsApp) {
                const phoneNumber = '573016726199';
                const whatsappMessage = encodeURIComponent('Hola, mi cuenta ha sido bloqueada y necesito ayuda');
                const mensajeLimpio = message.replace(/3128540908/g, '3016726199');

                Swal.fire({
                    icon: 'error',
                    title: 'Cuenta Suspendida',
                    html: `
                        ${mensajeLimpio}
                        <br><br>
                        <a href="https://wa.me/${phoneNumber}?text=${whatsappMessage}" 
                           style="display: inline-block; background: #25d366; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;"
                           target="_blank">
                            Contactar por WhatsApp
                        </a>
                    `,
                    showConfirmButton: true,
                    confirmButtonText: 'Cerrar'
                });
            } else {
                Swal.fire({
                    icon: iconType,
                    text: message,
                    timer: 3000,
                    showConfirmButton: false,
                    allowOutsideClick: true
                });
            }
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');

            if (isLoading) {
                btn.disabled = true;
                btnText.style.display = 'none';
                spinner.classList.add('show');
            } else {
                btn.disabled = false;
                btnText.style.display = 'flex';
                spinner.classList.remove('show');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('Por favor complete todos los campos', 'error');
                return;
            }

            setLoading(true);

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));

                    showAlert('¡Inicio de sesión exitoso! Redirigiendo...', 'success');

                    precargarDatos(data.usuario);

                    setTimeout(() => {
                        if (data.usuario.rol === 'superadmin') {
                            window.location.href = 'superadmin.html';
                        } else if (data.usuario.rol === 'admin') {
                            window.location.href = 'administrador.html';
                        } else if (data.usuario.rol === 'mesero') {
                            window.location.href = 'pedidos.html';
                        } else {
                            window.location.href = 'productos.html';
                        }
                    }, 1000);
                } else {
                    // Si la cuenta está bloqueada, mostrar mensaje especial con WhatsApp
                    if (data.bloqueado) {
                        showAlert(data.motivoBloqueo || data.message, 'error', true);
                    } else {
                        showAlert(data.message || 'Error al iniciar sesión', 'error', false);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error de conexión. Por favor intente nuevamente', 'error');
            } finally {
                setLoading(false);
            }
        });

        // 🚀 Login con Mandao
        const loginMandaoBtn = document.getElementById('loginMandaoBtn');
        if (loginMandaoBtn) {
            loginMandaoBtn.addEventListener('click', async () => {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    showAlert('Para iniciar con Mandao, ingresa tus credenciales de Mandao arriba', 'info');
                    return;
                }

                setLoading(true);

                try {
                    const response = await fetch(`${API_URL}/login-mandao`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('usuario', JSON.stringify(data.usuario));

                        let msg = '¡Inicio de sesión con Mandao exitoso!';

                        if (data.welcomeMessage) {
                            localStorage.setItem('welcome_mandao', 'true');
                            precargarDatos(data.usuario);
                            redirectUser(data.usuario);
                        } else {
                            showAlert(msg, 'success');
                            precargarDatos(data.usuario);
                            setTimeout(() => {
                                redirectUser(data.usuario);
                            }, 1000);
                        }

                    } else {
                        if (data.bloqueado) {
                            showAlert(data.motivoBloqueo || data.message, 'error', true);
                        } else {
                            showAlert(data.message || 'Error al iniciar sesión con Mandao', 'error', false);
                        }
                    }

                } catch (error) {
                    console.error('Error Mandao Login:', error);
                    showAlert('Error conectando con Mandao. Intenta de nuevo.', 'error');
                } finally {
                    setLoading(false);
                }
            });
        }

        function redirectUser(usuario) {
            if (usuario.rol === 'superadmin') {
                window.location.href = 'superadmin.html';
            } else if (usuario.rol === 'admin') {
                window.location.href = 'administrador.html';
            } else if (usuario.rol === 'mesero') {
                window.location.href = 'pedidos.html';
            } else {
                window.location.href = 'productos.html';
            }
        }

        // 🚀 SISTEMA DE PRECARGA CON PRIORIDAD (optimizado para baja memoria)
        window.dataCache = {
            productos: null,
            pedidos: null,
            alimentos: null,
            historial: null,
            gastos: null,
            liquidaciones: null,
            usuarios: null,
            loading: {},
            _maxSize: 2000, // Límite máximo de items por categoría

            // ✅ Limpieza automática de memoria
            _cleanup: function () {
                const keys = Object.keys(this).filter(k => !k.startsWith('_') && k !== 'loading');
                for (const key of keys) {
                    if (this[key] && Array.isArray(this[key]) && this[key].length > this._maxSize) {
                        console.log(`🧹 Memory cleanup: ${key} (${this[key].length} → ${this._maxSize})`);
                        this[key] = this[key].slice(0, this._maxSize);
                    }
                }
            },

            // ✅ Verificar uso de memoria approximate
            _getMemoryUsage: function () {
                try {
                    const str = JSON.stringify(this);
                    return Math.round(str.length / 1024); // KB
                } catch (e) { return 0; }
            }
        };

        async function precargarDatos(usuario) {
            const token = localStorage.getItem('token');
            if (!token) return;

            const headers = { 'Authorization': `Bearer ${token}` };
            const userId = usuario._id;

            // ✅ Usar límites según capacidad del dispositivo
            const perfLimit = window.getPerformanceLimit ? window.getPerformanceLimit() : { maxItems: 50000, staggerDelay: 100 };
            const limit = perfLimit.maxItems;
            const delay = perfLimit.staggerDelay;

            // PRIORIDAD 1: Productos (alta) - lo más necesario
            setTimeout(async () => {
                try {
                    const res = await fetch(`${API_URL}/products?userId=${userId}&limit=${limit}`, { headers });
                    const data = await res.json();
                    if (data.success) {
                        window.dataCache.productos = data.data;
                        console.log('✅ Productos precargados:', data.data.length);
                    }
                } catch (e) { console.error('Error precargando productos:', e); }
            }, delay);

            // PRIORIDAD 2: Pedidos activos (alta)
            setTimeout(async () => {
                try {
                    const res = await fetch(`${API_URL}/orders?userId=${userId}&limit=${limit}`, { headers });
                    const data = await res.json();
                    if (data.success) {
                        window.dataCache.pedidos = data.data;
                        console.log('✅ Pedidos precargados:', data.data.length);
                    }
                } catch (e) { console.error('Error precargando pedidos:', e); }
            }, delay * 3);

            // PRIORIDAD 3: Alimentos (media) - solo si no es dispositivo de muy baja capacidad
            if (perfLimit.maxItems > 200) {
                setTimeout(async () => {
                    try {
                        const res = await fetch(`${API_URL}/alimentos?userId=${userId}&limit=${limit}`, { headers });
                        const data = await res.json();
                        if (data.success) {
                            window.dataCache.alimentos = data.data;
                            console.log('✅ Alimentos precargados:', data.data.length);
                        }
                    } catch (e) { console.error('Error precargando alimentos:', e); }
                }, delay * 6);
            }

            // PRIORIDAD 4: Gastos (baja) - solo si no es dispositivo de muy baja capacidad
            if (perfLimit.maxItems > 200) {
                setTimeout(async () => {
                    try {
                        const res = await fetch(`${API_URL}/expenses?userId=${userId}&limit=${limit}`, { headers });
                        const data = await res.json();
                        if (data.success) {
                            window.dataCache.gastos = data.data;
                            console.log('✅ Gastos precargados:', data.data.length);
                        }
                    } catch (e) { console.error('Error precargando gastos:', e); }
                }, delay * 12);
            }

            // PRIORIDAD 5: Liquidaciones (baja) - solo en dispositivos normales/altos
            if (perfLimit.maxItems > 500) {
                setTimeout(async () => {
                    try {
                        const res = await fetch(`${API_URL}/liquidaciones?userId=${userId}&limit=${limit}`, { headers });
                        const data = await res.json();
                        if (data.success) {
                            window.dataCache.liquidaciones = data.data;
                            console.log('✅ Liquidaciones precargadas:', data.data.length);
                        }
                    } catch (e) { console.error('Error precargando liquidaciones:', e); }
                }, delay * 20);
            }

            // PRIORIDAD 6: Usuarios (solo admin/superadmin, solo dispositivos normales/altos)
            if ((usuario.rol === 'admin' || usuario.rol === 'superadmin') && perfLimit.maxItems > 500) {
                setTimeout(async () => {
                    try {
                        const res = await fetch(`${API_URL}/superadmin/usuarios?limit=${limit}`, { headers });
                        const data = await res.json();
                        if (data.success) {
                            window.dataCache.usuarios = data.data;
                            console.log('✅ Usuarios precargados:', data.data.length);
                        }
                    } catch (e) { console.error('Error precargando usuarios:', e); }
                }, delay * 25);
            }

            console.log('🚀 Precarga iniciada en background...');
        }

        // Función helper para obtener datos del caché o hacer fetch
        window.getCachedData = async function (key, fetchFn) {
            if (window.dataCache && window.dataCache[key]) {
                console.log(`📦 Usando caché para ${key}`);
                return window.dataCache[key];
            }
            return await fetchFn();
        };

        // Función para invalidar caché
        window.invalidateCache = function (key) {
            if (key) {
                window.dataCache[key] = null;
                console.log(`🗑️ Caché invalidado: ${key}`);
            } else {
                window.dataCache.productos = null;
                window.dataCache.pedidos = null;
                window.dataCache.alimentos = null;
                window.dataCache.historial = null;
                window.dataCache.gastos = null;
                window.dataCache.liquidaciones = null;
                window.dataCache.usuarios = null;
                console.log('🗑️ Todo el caché invalidado');
            }
            // ✅ Ejecutar limpieza de memoria después de invalidar
            if (window.dataCache._cleanup) window.dataCache._cleanup();
        };

        // ✅ Monitoreo de memoria cada 30 segundos (solo en bajo rendimiento)
        setInterval(() => {
            if (window.__deviceCaps && window.__deviceCaps.tier === 'low') {
                const memUsage = window.dataCache._getMemoryUsage();
                if (memUsage > 500) { // Si usa más de 500KB
                    console.log(`⚠️ High memory usage: ${memUsage}KB - running cleanup`);
                    window.dataCache._cleanup();
                }
            }
        }, 30000);

    </script>
</body>
